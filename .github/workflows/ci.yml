name: Security and regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run security:secrets
      - run: python3 -m unittest discover -s deploy/security -p 'test_*.py'
      - run: node --test deploy/security/backup-crypto.test.mjs
      - run: node --check deploy/security/prepare-redis.mjs && node --check deploy/security/activate-app.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  marketplace-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node --test deploy/marketplace-gateway.test.mjs
      - run: npm ci --prefix frontend
      - run: node scripts/security/dependency-audit.mjs --frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
