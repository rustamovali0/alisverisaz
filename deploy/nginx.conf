# Install only after the DNS-01 certificate has been issued.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name alisveris.az www.alisveris.az *.alisveris.az;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name alisveris.az www.alisveris.az *.alisveris.az;
    ssl_certificate /etc/letsencrypt/live/alisveris.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alisveris.az/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($host !~* ^([a-z0-9-]+\.)?alisveris\.az$) { return 444; }
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        # No blanket HTTP cache: session cookies, SSR, and writes must remain private.
    }
}
